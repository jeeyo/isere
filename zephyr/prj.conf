# isere - Zephyr configuration
# Serverless platform for microcontrollers

# Rust support
CONFIG_RUST=y

# Logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y

# Main thread stack
CONFIG_MAIN_STACK_SIZE=8192

# Heap for dynamic allocation
CONFIG_HEAP_MEM_POOL_SIZE=65536

