# native_sim for the platform evaluation (docs/PLATFORM_DECISION.md): the
# simulator's offloaded sockets (NSOS) use the host's own BSD sockets, so the
# server listens on a host port like the FreeRTOS Linux build and the same
# black-box tests and benchmark can reach it. No TAP device or NET_ADMIN needed.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_DRIVERS=y
CONFIG_POSIX_API=y

# NSOS checks the host for socket events every this many simulated microseconds
# when idle; the default of 1000 puts a 1 ms floor under every request
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS_EPOLL_WAIT_INTERVAL=50
