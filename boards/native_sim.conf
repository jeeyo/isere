# Board-specific Kconfig for native_sim (development target)

# Networking via host TAP interface
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DRIVERS=y
CONFIG_ETH_NATIVE_POSIX=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# POSIX API: provides unprefixed socket names and gettimeofday.
# Our Rust FFI uses zsock_* link names directly (see platform/tcp.rs),
# so this doesn't affect socket routing — kept for other POSIX functions.
CONFIG_POSIX_API=y

# Slow down simulated time to match real time (required for external
# interaction via TAP — without this, TCP/ARP timing breaks with curl)
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y

# Network configuration
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Network logging
CONFIG_NET_LOG=y

# Network buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=128
