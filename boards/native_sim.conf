# Board-specific Kconfig for native_sim (development target)
#
# On native_sim, socket calls (socket/bind/listen/etc.) resolve to glibc's
# POSIX implementation — the server binds on the host network stack directly.
# This is fine for integration testing via localhost. Zephyr's own network
# stack (TAP/Ethernet) is exercised on real hardware (RP2350).

# Networking (enables Zephyr's networking subsystem for CONFIG_POSIX_API)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# Network logging
CONFIG_NET_LOG=y

# Network buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=128
