[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra --tb=short
# xunit1 carries <properties> under each <testcase>, which is how the case
# metadata travels in the standard report. xunit2 drops them.
junit_family = xunit1
# capture stdout/stderr into the XML -- the soak and latency numbers the tests
# print are the interesting part of the result, not just pass/fail
junit_logging = all
junit_log_passing_tests = True
markers =
    slow: long-running soaks; deselect with -m "not slow"
    case: descriptive metadata for the test report
# Tests share a compile-time listen port, so they must not run in parallel.
