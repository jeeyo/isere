name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc g++ make cmake xxd

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake -DTARGET_PLATFORM=linux -DJS_RUNTIME=quickjs ..
          make -j4

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: isere-linux
          path: build/isere
          retention-days: 7

  integration:
    name: Integration tests (Linux)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc xxd python3 python3-pytest

      - uses: actions/download-artifact@v4
        with:
          name: isere-linux
          path: build

      - name: Run integration tests
        env:
          ISERE_BIN: ${{ github.workspace }}/build/isere
        run: |
          chmod +x "$ISERE_BIN"
          python3 -m pytest tests/integration \
            -v -m "not slow" \
            --junitxml=integration-results.xml

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: integration-results.xml
          check_name: Integration test report

  leaks:
    name: Leak and soak tests (valgrind)
    runs-on: ubuntu-latest
    needs: build
    # valgrind runs the soaks at roughly 30x slowdown
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc xxd python3 python3-pytest valgrind

      - uses: actions/download-artifact@v4
        with:
          name: isere-linux
          path: build

      - name: Run leak and soak tests
        env:
          ISERE_BIN: ${{ github.workspace }}/build/isere
        run: |
          chmod +x "$ISERE_BIN"
          python3 -m pytest tests/integration \
            -v -m "slow" \
            --junitxml=leak-results.xml

      - name: Publish leak report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: leak-results.xml
          check_name: Leak test report
