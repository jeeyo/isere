name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  linux:
    # tools/linux.sh: build, fuzz the HTTP parser under ASan, the node:test suite
    # (with valgrind), and wrk. The same loop runs locally and on the Pico 2.
    name: Linux loop (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [quickjs, jerryscript]
    steps:
      - uses: actions/checkout@v4

      - name: Check out the submodules the Linux build needs
        run: git submodule update --init --depth 1 3rdparty/FreeRTOS 3rdparty/quickjs 3rdparty/jerryscript 3rdparty/mbedtls

      - name: Install tools (as in tools/linux.Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git xxd curl ca-certificates valgrind wrk clang libclang-rt-18-dev openssl

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: tools/linux.sh
        run: tools/linux.sh --runtime ${{ matrix.runtime }} --fuzz 60 --bench-duration 5

      - name: Upload results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runtime }}
          path: hil-results/

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: 'hil-results/*/tests.xml'
          check_name: Tests (${{ matrix.runtime }})
