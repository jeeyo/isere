name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ZEPHYR_SDK_VERSION: 1.0.0
  ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk-1.0.0

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

  bytecode:
    name: Compile Bytecode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Compile bytecode
        run: |
          chmod +x scripts/compile_bytecode.sh
          ./scripts/compile_bytecode.sh js/handler.js js/handler.bin

      - name: Upload bytecode artifact
        uses: actions/upload-artifact@v4
        with:
          name: handler-bytecode
          path: js/handler.bin

  build:
    name: Build (${{ matrix.board }})
    runs-on: ubuntu-latest
    needs: bytecode
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: native_sim/native/64
            arch: x86
          - board: rpi_pico2/rp2350a/m33
            arch: arm

    steps:
      # Checkout into workspace/app/ to match west.yml self.path: app
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: app

      - name: Download bytecode artifact
        if: matrix.arch == 'arm'
        uses: actions/download-artifact@v4
        with:
          name: handler-bytecode
          path: app/js/

      - name: Remove placeholder bytecode for native_sim
        if: matrix.arch == 'x86'
        run: rm -f app/js/handler.bin

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util \
            device-tree-compiler wget python3-dev python3-pip \
            python3-setuptools python3-tk python3-wheel \
            xz-utils file make gcc gcc-multilib g++ g++-multilib \
            libsdl2-dev libmagic1

      - name: Install west and Python dependencies
        run: |
          pip3 install west

      - name: Initialize west workspace
        run: |
          west init -l app
          west update --narrow --fetch-opt=--depth=1

      - name: Install additional Python dependencies
        run: |
          pip3 install -r zephyr/scripts/requirements.txt

      - name: Cache Zephyr SDK
        id: cache-zephyr-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-${{ matrix.arch }}

      - name: Install Zephyr SDK
        if: steps.cache-zephyr-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz -C /opt/
          ${ZEPHYR_SDK_INSTALL_DIR}/setup.sh -h -c
          # In SDK 1.0.0, cmake looks for toolchains in ${ZEPHYR_SDK_INSTALL_DIR}/gnu/.
          # The individual toolchain tarballs extract without a gnu/ prefix, so we
          # must create that directory and extract into it.
          mkdir -p ${ZEPHYR_SDK_INSTALL_DIR}/gnu
          if [ "${{ matrix.arch }}" = "arm" ]; then
            wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/toolchain_gnu_linux-x86_64_arm-zephyr-eabi.tar.xz
            tar xf toolchain_gnu_linux-x86_64_arm-zephyr-eabi.tar.xz -C ${ZEPHYR_SDK_INSTALL_DIR}/gnu
            rm toolchain_gnu_linux-x86_64_arm-zephyr-eabi.tar.xz
            # FindHostTools also needs x86_64-zephyr-elf even when cross-compiling for ARM
            wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/toolchain_gnu_linux-x86_64_x86_64-zephyr-elf.tar.xz
            tar xf toolchain_gnu_linux-x86_64_x86_64-zephyr-elf.tar.xz -C ${ZEPHYR_SDK_INSTALL_DIR}/gnu
            rm toolchain_gnu_linux-x86_64_x86_64-zephyr-elf.tar.xz
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf, x86_64-unknown-none

      - name: Build firmware
        run: |
          west build -b ${{ matrix.board }} -p always app/
        env:
          ZEPHYR_SDK_INSTALL_DIR: ${{ env.ZEPHYR_SDK_INSTALL_DIR }}

      - name: Upload native_sim binary
        if: matrix.arch == 'x86'
        uses: actions/upload-artifact@v4
        with:
          name: native-sim-binary
          path: build/zephyr/zephyr.exe

      - name: Upload RP2350 UF2
        if: matrix.arch == 'arm'
        uses: actions/upload-artifact@v4
        with:
          name: rpi-pico2-uf2
          path: build/zephyr/zephyr.uf2

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download native_sim binary
        uses: actions/download-artifact@v4
        with:
          name: native-sim-binary
          path: bin/

      - name: Run integration tests
        timeout-minutes: 3
        run: |
          scripts/integration_test.sh bin/zephyr.exe
