# isere - Zephyr configuration
# Serverless platform for microcontrollers

# Rust support
CONFIG_RUST=y

# C library (required by QuickJS for malloc/free/printf)
CONFIG_NEWLIB_LIBC=y

# Logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y

# Main thread stack (needs headroom for QuickJS eval)
CONFIG_MAIN_STACK_SIZE=16384

# Heap for dynamic allocation (QuickJS + HTTP buffers)
# 128KB allows ~80KB for JS heap + 48KB for networking/buffers
CONFIG_HEAP_MEM_POOL_SIZE=131072

# Timers (for setTimeout/clearTimeout polyfills)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Networking is configured per-board in boards/*.conf
# (rpi_pico2: USB CDC-ECM, native_sim: TAP interface)
